<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1120" role="img" aria-labelledby="title desc">
<title id="title">成品展示霓虹衣柜进场动画</title><desc id="desc">衣柜从左向右减速滑入，六件衣服和吊牌因惯性向左摆动后逐渐静止，滑轮滚动，周围出现风线。</desc>
<defs><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="fabric" x2="1" y2="1"><stop stop-color="#170726"/><stop offset=".55" stop-color="#350957"/><stop offset="1" stop-color="#0a0611"/></linearGradient><linearGradient id="tag" x2="1" y2="1"><stop stop-color="#a613e6"/><stop offset="1" stop-color="#390463"/></linearGradient></defs>
<style>
  svg{overflow:visible}.rack,.garment,.hanger,.tag,.details{fill:none;stroke:#c670ff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}.rack{stroke-width:5}.garment{fill:url(#fabric)}.tag{fill:url(#tag);stroke:#ef85ff;stroke-width:5;transform-box:fill-box;transform-origin:50% 0;transform:scale(1.22,1.42)}.tag-name{fill:#fff1c0;stroke:#481065;stroke-width:2;paint-order:stroke fill;font:800 39px "Microsoft YaHei","PingFang SC",sans-serif;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:7px;text-anchor:start;filter:url(#glow)}.tag-name.long{font-size:32px;letter-spacing:6px}.tag-name.lihuowang{fill:#ff3038;stroke:#ffe1e1}.tag-name.tulaoshi{fill:#ffffff;stroke:#632081}.tag-name.huituban{fill:#123b91;stroke:#b7d5ff}.tag-name.xiaozhuyou{fill:#9f1428;stroke:#ffc0cc}.tag-name.baimianju{fill:#b76aff;stroke:#f4d5ff}.sign-board{fill:#16091e;stroke:#dd7cff;stroke-width:5;filter:url(#glow)}.sign-trim{fill:none;stroke:#f5cf6b;stroke-width:2.5;filter:url(#glow)}.sign-gem{fill:#f5dc78;stroke:#fff4b9;stroke-width:2;filter:url(#glow);transform-box:fill-box;transform-origin:center;animation:gem-twinkle 2.4s ease-in-out infinite}.sign-text{fill:#f0bdff;stroke:#c452ed;stroke-width:1.2;paint-order:stroke fill;filter:url(#glow);font:700 46px "Microsoft YaHei","PingFang SC",sans-serif;letter-spacing:12px;text-anchor:middle;animation:sign-flicker 3.2s ease-in-out infinite}.details{stroke:#a849e3;stroke-width:2.5;filter:none}.wheel{fill:#13071c;stroke:#d279ff;stroke-width:6;filter:url(#glow)}.spoke{stroke:#f2bbff;stroke-width:4;stroke-linecap:round;filter:url(#glow)}.hub{fill:#f1d44f;stroke:#fff2ac;stroke-width:2;filter:url(#glow)}.cloth{animation:sway 2.6s ease-out both;transform-box:fill-box;transform-origin:50% 0}.cloth:nth-of-type(2){animation-delay:.03s}.cloth:nth-of-type(3){animation-delay:.06s}.cloth:nth-of-type(4){animation-delay:.02s}.cloth:nth-of-type(5){animation-delay:.07s}.cloth:nth-of-type(6){animation-delay:.04s}.label{animation:label-sway 2.6s ease-out both;transform-box:fill-box;transform-origin:50% 0}.rolling{animation:roll 2.6s cubic-bezier(.12,.7,.16,1) both;transform-box:fill-box;transform-origin:center}.wind{fill:none;stroke:#e595ff;stroke-width:4;stroke-linecap:round;filter:url(#glow);stroke-dasharray:170;stroke-dashoffset:170;opacity:0;animation:gust 2.6s ease-out both}.wind:nth-child(even){animation-delay:.1s}@keyframes sway{0%{transform:rotate(0)}13%{transform:rotate(21deg)}35%{transform:rotate(13deg)}62%{transform:rotate(-7deg)}82%{transform:rotate(3deg)}100%{transform:rotate(0)}}@keyframes label-sway{0%{transform:rotate(0)}16%{transform:rotate(-19deg)}44%{transform:rotate(-8deg)}68%{transform:rotate(5deg)}84%{transform:rotate(-2deg)}100%{transform:rotate(0)}}@keyframes roll{0%{transform:rotate(-1440deg)}70%{transform:rotate(-95deg)}100%{transform:rotate(0)}}@keyframes gust{0%{opacity:0;stroke-dashoffset:170;transform:translateX(20px)}15%{opacity:.8}55%{opacity:.65;stroke-dashoffset:0;transform:translateX(-35px)}100%{opacity:0;stroke-dashoffset:-170;transform:translateX(-80px)}}@keyframes sign-flicker{0%,17%,23%,48%,54%,100%{opacity:1;fill:#ffe0ff;filter:drop-shadow(0 0 8px #f291ff) drop-shadow(0 0 18px #bd43ff)}19%,51%{opacity:.58;fill:#c87cdc;filter:none}20%,52%{opacity:.93;fill:#fff2ff;filter:drop-shadow(0 0 12px #fff)}}@keyframes gem-twinkle{0%,100%{opacity:.65;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important}.wind{display:none}.sign-text,.sign-gem{animation:none}}
</style>
